<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>csv</title>
  <link rel="icon" href="logo/nanocell.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/palettes/light.css" id="palette" style="display:none">
  <link rel="stylesheet" href="css/themes/light.css" id="theme" style="display:none">
  <script>
    (function() {
      try {
        const t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        if (document.body) document.body.setAttribute('data-theme', t);
        else document.addEventListener('DOMContentLoaded', function() { if (document.body) document.body.setAttribute('data-theme', t); });
      } catch(e) { console.warn('Theme preference init failed:', e); }
    })();
  </script>


</head>

<body id="body" class="flexCol">
  <header id="header"></header>
  <div id="content" class="flexMain">
    <div id="main-container">
      <ui-sheet id="sheet"></ui-sheet>
    </div>
    <ui-validation-pane id="validation-pane"></ui-validation-pane>
  </div>
  <footer>
    <section id="footer">
      <section id="footerLeft">Left</section>
      <section id="footerCenter" class="flexMain">Center</section>
      <section id="footerRight">Right</section>
      <span id="lock" class="icon" role="img" aria-label="editing file" data-src="icn/edit.svg"></span>
    </section>
  </footer>
  <section id="dialog" class="scroll"></section>
  <ui-command-palette></ui-command-palette>
  <script type="module" src="js/main.js"></script>
</body>

</html>
